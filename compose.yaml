name: fold-web

services:
  app:
    image: ${APP_IMAGE:-victoriatech/fold_web:latest}
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-10000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN is required}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:?AUTH_RATE_LIMIT_SECRET is required}
    # DATABASE_URL 이 호스트에 떠 있는 PostgreSQL을 가리킬 때, 컨테이너 안의
    # `127.0.0.1`은 컨테이너 자신이라 호스트에 닿지 않는다. `host.docker.internal`을
    # 쓰도록 DATABASE_URL 에 반영하고, 이 host 는 여기서 게이트웨이로 풀어준다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  # web과 같은 이미지를 쓰고 진입점만 다르다(`D2-B01-B`).
  worker:
    image: ${APP_IMAGE:-victoriatech/fold_web:latest}
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    restart: unless-stopped
    init: true
    command: ["node", "worker.mjs"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # 긴 작업이 web용 5초 statement timeout에 끊기지 않도록 worker는 따로 잡는다.
      DATABASE_STATEMENT_TIMEOUT_MS: "${WORKER_DATABASE_STATEMENT_TIMEOUT_MS:-60000}"
      DATABASE_CONNECTION_LIMIT: "${WORKER_DATABASE_CONNECTION_LIMIT:-4}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 이미지의 HEALTHCHECK 는 `/api/health`(포트 3000)를 본다. worker 는
    # HTTP 서버를 안 띄우니 그대로 두면 항상 실패해 계속 재시작된다.
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    # 돌고 있는 작업이 끝날 시간을 준다. 못 끝내도 lease 만료로 회수된다.
    stop_grace_period: 60s

  # 로컬 개발·테스트용 S3 호환 저장소(`D2-B02-A`).
  # 운영 서버 적용은 `P2-C08` 배포 작업에서 함께 한다.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${STORAGE_ACCESS_KEY_ID:-fold-web-local}"
      MINIO_ROOT_PASSWORD: "${STORAGE_SECRET_ACCESS_KEY:-fold-web-local-secret}"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  storage-data:
